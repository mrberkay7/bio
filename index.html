<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>berkayre4l | Hoş Geldin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
            width: 100%;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-text {
            font-size: 2.5em;
            font-weight: 300;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: typewriter 2s steps(20);
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid white;
        }

        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }

        .instagram-logo {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            border-radius: 25px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .instagram-logo::before {
            content: '';
            width: 40px;
            height: 40px;
            border: 3px solid white;
            border-radius: 12px;
        }

        .instagram-logo::after {
            content: '';
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 22px;
            right: 22px;
        }

        .username {
            font-size: 1.4em;
            color: white;
            margin-bottom: 30px;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .bio {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2em;
            color: #333;
            font-weight: 500;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transform: perspective(500px) rotateX(5deg);
            transition: all 0.3s ease;
        }

        .bio:hover {
            transform: perspective(500px) rotateX(0deg) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .quote {
            margin-top: 25px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 15px;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-text">Welcome to</div>
        
        <div class="instagram-logo pulse"></div>
        
        <div class="username">@berkayre4l</div>
        
        <div class="bio">
            "nefret ediyorsan yenilmişsindir"
        </div>
        
        <div class="quote">
            CYBER GUARD 💻!
        </div>
    </div>

    <script>
        // Yazı yazma efekti bittikten sonra imleci kaldır
        setTimeout(() => {
            document.querySelector('.welcome-text').style.borderRight = 'none';
        }, 2500);

        // Tıklama efekti
        document.addEventListener('click', function() {
            document.querySelector('.container').style.transform = 'scale(0.95)';
            setTimeout(() => {
                document.querySelector('.container').style.transform = 'scale(1)';
            }, 150);
        });
    </script>
</body>
</html>
